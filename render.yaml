# Render Blueprint: creates the MEDIC CARE web service from this repo.
services:
  - type: web
    name: medic-care
    runtime: python
    plan: free
    region: singapore            # pick the same region as your Supabase project if you can
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 60
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY            # signs the login cookies; Render makes a random one
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL          # you paste your Supabase connection string when asked
        sync: false
